<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Error Correction Exercise Generator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="workspace" aria-label="誤り修正課題生成器">
        <header class="topbar">
          <div>
            <p class="eyebrow">Prototype</p>
            <h1>誤り修正課題ジェネレータ</h1>
          </div>
          <div class="mode-switcher" role="radiogroup" aria-label="表示モード切替">
            <button id="learnerModeBtn" type="button" class="mode-btn active" aria-checked="true">👨‍🎓 学習モード</button>
            <button id="creatorModeBtn" type="button" class="mode-btn" aria-checked="false">👨‍🏫 問題作成モード</button>
          </div>
          <div class="score" id="score" aria-live="polite">未採点</div>
        </header>

        <section class="guide" aria-label="操作ガイド">
          <div>
            <p class="guide-label">操作ガイド</p>
            <p id="guideText" class="guide-text">正しく動くC/C++プログラムを貼り付けます。</p>
          </div>
          <div class="guide-actions">
            <button id="guidePrev" type="button" class="secondary">戻る</button>
            <button id="guideNext" type="button">次へ</button>
          </div>
        </section>

        <section id="exerciseSelectorArea" class="exercise-selector-bar" aria-label="問題選択">
          <label for="exerciseSelect" class="selector-label">📚 問題を選択:</label>
          <select id="exerciseSelect" class="exercise-select">
            <option value="">問題データを読み込み中...</option>
          </select>
        </section>

        <section id="creatorPanel" class="generator hidden" aria-label="問題生成">
          <label class="source-field" data-guide-target="source">
            <span>正しいC/C++プログラム</span>
            <textarea id="correctSource" spellcheck="false"></textarea>
          </label>

          <label class="tests-field" data-guide-target="tests">
            <span>テスト入力</span>
            <textarea id="testsInput" spellcheck="false"></textarea>
          </label>

          <div class="rule-options" data-guide-target="options">
            <label>
              <span>最大誤り数</span>
              <input id="maxRules" type="number" min="1" max="12" value="4" />
            </label>
            <button id="generateButton" type="button" data-guide-target="generate">問題生成</button>
          </div>

          <div id="saveExerciseArea" class="save-exercise-area hidden">
            <div class="save-form">
              <label class="title-field">
                <span>保存タイトル</span>
                <input id="exerciseTitleInput" type="text" placeholder="例: 配列の平均値計算問題" />
              </label>
              <button id="saveExerciseBtn" type="button" class="accent">この問題をストックに保存</button>
            </div>
          </div>

          <div class="saved-list-area">
            <h3>保存済みの問題ストック一覧</h3>
            <div id="savedExercisesList" class="saved-list">読み込み中...</div>
          </div>
        </section>

        <section class="exercise-layout" data-guide-target="exercise">
          <div class="problem">
            <div class="code" id="exercise" aria-label="編集可能なC/C++プログラム"></div>
          </div>

          <aside class="case-panel" aria-label="テストケースと出力">
            <div id="result" class="result" aria-live="polite">
              上から順に確認し、OKだと思った行にチェックを入れられます。
            </div>
          </aside>
        </section>

        <footer class="answerbar" aria-label="採点操作">
          <div class="actions">
            <button id="checkButton" type="button" data-guide-target="check">解答</button>
            <button id="debugButton" type="button" class="secondary" disabled>coutヒント</button>
            <button id="resetButton" type="button" class="secondary">リセット</button>
          </div>
        </footer>
      </section>
    </main>

    <template id="codeLineTemplate">
      <div class="code-line">
        <button class="line-review" type="button" aria-pressed="false">✓</button>
        <span class="line-number" aria-hidden="true"></span>
        <span class="line-code" contenteditable="true" role="textbox" spellcheck="false"></span>
      </div>
    </template>

    <script src="app.js"></script>
  </body>
</html>
